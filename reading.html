<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luyện đọc Aluni</title>
<style>
:root{--blue:#536be8;--navy:#18233f;--muted:#68738d;--line:#dce3f2;--bg:#f5f7fc;--yellow:#ffe68a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px}.back{border:1px solid var(--line);background:#fff;border-radius:14px;width:44px;height:44px;font-size:22px}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-weight:600}.wrap{max-width:980px;margin:auto;padding:22px 16px 60px}.eyebrow{color:var(--blue);font-weight:900;text-transform:uppercase;font-size:13px;letter-spacing:.08em}h1{margin:8px 0 4px;font-size:clamp(25px,5vw,38px)}.meta{color:var(--muted)}.card{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(46,64,120,.07)}.reading{padding:clamp(20px,5vw,44px);font-size:clamp(27px,5vw,38px);line-height:1.9}.sentence{border-radius:10px;padding:2px 4px;transition:.2s}.sentence.active{background:#edf1ff;box-shadow:0 0 0 2px #bfcaff}.word{cursor:pointer;border-radius:6px}.word.focus{background:var(--yellow);box-shadow:inset 0 -2px #e6bd28}.controls{border-top:1px solid var(--line);padding:14px 16px}.modebar,.nav,.numbers,.record{display:flex;align-items:center;gap:8px}.modebar{justify-content:space-between;flex-wrap:wrap}.modes{display:flex;gap:6px}.pill,.nav button,.num,.record button{border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:800;border-radius:12px;padding:10px 13px}.pill.active,.nav button.primary,.num.active,.record button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.counter{font-weight:900}.nav{margin-top:10px;display:grid;grid-template-columns:1fr minmax(130px,2fr) 1fr}.nav button{min-height:46px}.current{text-align:center;font-weight:900}.numbers{margin-top:14px;flex-wrap:wrap}.num{width:38px;height:38px;padding:0}.record{margin-top:14px;justify-content:space-between;flex-wrap:wrap}.status{color:var(--muted);font-size:14px}.dict{position:fixed;z-index:30;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,440px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 60px rgba(20,31,67,.22)}.dict[hidden]{display:none}.dict h2{font-size:30px;margin:0}.dict .py{color:var(--blue);font-weight:800;margin-top:5px}.dict .vi{margin-top:8px}.dict .x{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:24px}.dict .speak{margin-top:12px;border:0;background:var(--blue);color:#fff;font-weight:800;padding:10px 14px;border-radius:10px}.loading,.error{padding:45px;text-align:center;color:var(--muted)}@media(max-width:560px){.wrap{padding:14px 10px 36px}.card{border-radius:16px}.reading{padding:20px 16px;font-size:28px;line-height:1.75}.controls{padding:12px 10px}.nav{grid-template-columns:44px 1fr 44px}.nav button{padding:8px}.nav .label{display:none}.modebar{flex-wrap:nowrap}.pill{padding:9px 10px}.numbers{gap:6px}.num{width:34px;height:34px}.record button{width:100%}}
</style>
</head>
<body>
<header class="top"><button class="back" onclick="history.back()" aria-label="Quay lại">←</button><div class="brand">ALUNI <small>Luyện đọc</small></div></header>
<main class="wrap"><div class="eyebrow" id="courseName">Đang tải khóa học</div><h1 id="title">Luyện đọc</h1><div class="meta" id="meta"></div><section class="card"><div id="reading" class="reading"><div class="loading">Đang tải bài đọc…</div></div><div class="controls" id="controls" hidden><div class="modebar"><div class="modes"><button id="single" class="pill active">Từng câu</button><button id="continuous" class="pill">Liên tục</button></div><span class="counter" id="counter">1/1</span></div><div class="nav"><button id="prev">← <span class="label">Câu trước</span></button><div class="current" id="current">Câu 1</div><button id="next"><span class="label">Câu tiếp</span> →</button></div><div class="numbers" id="numbers"></div><div class="record"><button id="recordBtn">🎙 Ghi âm</button><span class="status" id="recordStatus">Nhìn câu đang nổi để đọc và ghi âm.</span><audio id="playback" controls hidden></audio></div></div></section></main>
<aside class="dict" id="dict" hidden><button class="x" id="dictClose">×</button><h2 id="dictHanzi"></h2><div class="py" id="dictPinyin"></div><div class="vi" id="dictVi"></div><button class="speak" id="dictSpeak">🔊 Nghe phát âm</button></aside>
<script>
const API='https://aluni-tts.nhangohcm.workers.dev',params=new URLSearchParams(location.search),courseId=params.get('course_id')||'',lessonNumber=Number(params.get('lesson_number')||0);
let data=null,index=0,mode='single',playing=false,audio=null,recording=false,recorder=null,chunks=[],stream=null,playToken=0;
const audioCache=new Map();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stopAudio(){playToken++;if(audio){audio.pause();audio.src='';audio=null}playing=false}
function vocabAt(text,start){const list=(data?.passage?.vocab||[]).filter(v=>v.hanzi&&text.startsWith(v.hanzi,start)).sort((a,b)=>b.hanzi.length-a.hanzi.length);return list[0]||null}
function tokenize(text){const out=[];for(let i=0;i<text.length;){const v=vocabAt(text,i);if(v){out.push({text:v.hanzi,v,focus:true});i+=v.hanzi.length;continue}let seg=text[i];if(/\p{Script=Han}/u.test(seg)&&Intl.Segmenter){const part=[...new Intl.Segmenter('zh',{granularity:'word'}).segment(text.slice(i))][0]?.segment||seg;seg=part}out.push({text:seg,v:null,focus:false});i+=seg.length}return out}
function renderInitial(){const ss=data.passage.sentences||[];$('reading').innerHTML=ss.map((s,si)=>`<span class="sentence ${si===index?'active':''}" data-si="${si}">${tokenize(s.hanzi).map(x=>`<span class="word ${x.focus?'focus':''}" data-word="${esc(x.text)}" data-py="${esc(x.v?.pinyin||'')}" data-vi="${esc(x.v?.vi||'')}">${esc(x.text)}</span>`).join('')}</span>${si<ss.length-1?'<br>':''}`).join('');$('numbers').innerHTML=ss.map((_,i)=>`<button class="num ${i===index?'active':''}" data-i="${i}">${i+1}</button>`).join('');bindWords();document.querySelectorAll('.num').forEach(b=>b.onclick=()=>select(Number(b.dataset.i),true));updateActive(false)}
function updateActive(scroll=true){document.querySelectorAll('.sentence').forEach((el,i)=>el.classList.toggle('active',i===index));document.querySelectorAll('.num').forEach((el,i)=>el.classList.toggle('active',i===index));$('counter').textContent=`${index+1}/${data.passage.sentences.length}`;$('current').textContent=`Câu ${index+1}`;if(scroll&&mode==='continuous')$('reading').querySelector('.sentence.active')?.scrollIntoView({block:'center',behavior:'smooth'})}
function bindWords(){document.querySelectorAll('.word').forEach(w=>w.onclick=e=>{e.stopPropagation();const text=w.dataset.word,known=(data.passage.vocab||[]).find(v=>v.hanzi===text);showDict({hanzi:text,pinyin:w.dataset.py||known?.pinyin||'',vi:w.dataset.vi||known?.vi||''})})}
function showDict(v){$('dictHanzi').textContent=v.hanzi;$('dictPinyin').textContent=v.pinyin||'Đang dùng âm đọc tiếng Trung';$('dictVi').textContent=v.vi||'Từ này chưa có nghĩa trong danh sách trọng tâm.';$('dict').hidden=false;$('dictSpeak').onclick=()=>speak(v.hanzi,false)}
function select(i,user=false){const ss=data.passage.sentences||[];index=Math.max(0,Math.min(ss.length-1,i));if(recording||user)stopAudio();updateActive(true);preloadAround(index);if(user&&!recording&&mode==='single')speak(ss[index].hanzi,false)}
function audioUrl(text){if(!audioCache.has(text))audioCache.set(text,fetch(`${API}/tts?text=${encodeURIComponent(text)}`).then(r=>{if(!r.ok)throw new Error('TTS');return r.blob()}).then(b=>URL.createObjectURL(b)).catch(()=>`${API}/tts?text=${encodeURIComponent(text)}`));return audioCache.get(text)}
function preloadAround(from){const ss=data?.passage?.sentences||[];for(let i=from;i<Math.min(ss.length,from+4);i++)audioUrl(ss[i].hanzi)}
async function speak(text,next){if(recording)return;stopAudio();const token=playToken;playing=true;try{const src=await audioUrl(text);if(token!==playToken||recording)return;audio=new Audio(src);audio.onended=()=>{playing=false;if(next&&mode==='continuous'&&index<data.passage.sentences.length-1){index++;updateActive(true);preloadAround(index);speak(data.passage.sentences[index].hanzi,true)}};await audio.play()}catch(e){playing=false;$('recordStatus').textContent='Chạm lại để cho phép phát âm.'}}
async function startContinuous(){mode='continuous';$('single').classList.remove('active');$('continuous').classList.add('active');$('reading').scrollIntoView({block:'start',behavior:'smooth'});updateActive(false);preloadAround(index);if(!recording)setTimeout(()=>speak(data.passage.sentences[index].hanzi,true),260)}
async function toggleRecord(){if(recording){recorder?.stop();return}stopAudio();try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{recording=false;stream?.getTracks().forEach(t=>t.stop());const url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));$('playback').src=url;$('playback').hidden=false;$('recordBtn').classList.remove('active');$('recordBtn').textContent='🎙 Ghi âm lại';$('recordStatus').textContent='Đã ghi xong — nghe lại bên cạnh.'};recorder.start();recording=true;$('recordBtn').classList.add('active');$('recordBtn').textContent='■ Dừng ghi';$('recordStatus').textContent='Đang ghi — đổi câu chỉ đổi chữ, không phát giọng mẫu.'}catch(e){$('recordStatus').textContent='Trình duyệt chưa cấp quyền micro.'}}
$('prev').onclick=()=>select(index-1,true);$('next').onclick=()=>select(index+1,true);$('single').onclick=()=>{mode='single';stopAudio();$('single').classList.add('active');$('continuous').classList.remove('active')};$('continuous').onclick=startContinuous;$('recordBtn').onclick=toggleRecord;$('dictClose').onclick=()=>$('dict').hidden=true;document.addEventListener('click',e=>{if(!e.target.closest('.dict,.word'))$('dict').hidden=true});
async function load(){try{const r=await fetch(`${API}/reading/lesson?course_id=${encodeURIComponent(courseId)}&lesson_number=${lessonNumber}`,{cache:'default'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Không tải được bài đọc');data=j;$('courseName').textContent=j.course.title;$('title').textContent=`Bài ${String(j.lesson.number).padStart(2,'0')} · ${j.lesson.title}`;$('meta').textContent='Bấm từ để tra và nghe · Chọn Từng câu hoặc Liên tục';$('controls').hidden=false;renderInitial();preloadAround(0)}catch(e){$('reading').innerHTML=`<div class="error">${esc(e.message)}<br><button class="pill" onclick="location.reload()">Thử lại</button></div>`}}
load();
</script>
</body></html>
