<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aluni AI Speak — Bản thử tách riêng</title>
<style>
:root{--red:#d71920;--ink:#172033;--muted:#6d7890;--line:#e2e7f0;--paper:#fff;--bg:#f4f6fb;--green:#16845d}*{box-sizing:border-box}html,body{width:100%;min-height:100%;overflow-x:hidden}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px clamp(12px,2vw,28px);display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--red);color:#fff;font-weight:900;flex:0 0 auto}.top b{font-size:1.05rem}.test{margin-left:auto;padding:7px 11px;border-radius:999px;background:#fff4d8;color:#8a6100;font-weight:800;font-size:.78rem}.wrap{width:100%;max-width:none;margin:0;padding:14px clamp(12px,2vw,28px) 20px}.setup,.chat,.side{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(40,55,90,.06)}.setup{padding:13px 15px;display:grid;grid-template-columns:minmax(210px,1fr) minmax(210px,1fr) auto;gap:10px;align-items:end}.setup label{display:grid;gap:6px;font-weight:800;font-size:.8rem}.setup select{min-width:0;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:14px;margin-top:14px;min-height:calc(100dvh - 210px)}.chat{height:calc(100dvh - 210px);min-height:620px;display:flex;flex-direction:column;overflow:hidden}.chathead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex:0 0 auto}.chathead b{font-size:1.12rem}.status{color:var(--green);font-weight:800;font-size:.8rem;white-space:nowrap}.messages{flex:1;min-height:0;overflow:auto;padding:20px clamp(16px,2.4vw,34px);display:grid;align-content:start;gap:14px;background:#fafbfe;scroll-behavior:smooth}.msg{width:fit-content;max-width:min(82%,900px);padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:#fff;box-shadow:0 4px 14px rgba(40,55,90,.04)}.msg.user{justify-self:end;background:var(--red);color:#fff;border-color:var(--red)}.hanzi{font-size:clamp(1.35rem,1.8vw,1.65rem);line-height:1.5;font-weight:800}.pinyin{color:#ad2730;margin-top:6px;font-size:1.02rem;line-height:1.45}.msg.user .pinyin{color:#fff}.vi{color:var(--muted);font-style:italic;margin-top:5px;font-size:1rem;line-height:1.45}.feedback{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:.95rem;line-height:1.55}.composer{position:sticky;bottom:0;padding:13px 16px;border-top:1px solid var(--line);background:#fff;display:grid;grid-template-columns:auto 1fr auto;gap:10px;flex:0 0 auto}.composer input{min-width:0;padding:13px 15px;border:1px solid var(--line);border-radius:13px;font-size:1rem}.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--red);color:#fff}.mic{width:52px;background:#fee8e8;color:var(--red);font-size:1.3rem}.side{padding:15px;height:calc(100dvh - 210px);min-height:620px;overflow:auto}.side h3{margin-top:0}.suggestion{display:block;width:100%;text-align:left;margin:9px 0;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fafbfe;cursor:pointer;line-height:1.42}.suggestion b{font-size:1.05rem}.notice{padding:12px;border-radius:13px;background:#fff4d8;color:#765400;font-size:.86rem;line-height:1.45}.error{color:#ae3030;font-weight:700;margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}.chat{height:calc(100dvh - 230px);min-height:620px}.side{height:auto;min-height:0;overflow:visible;order:2}.side h3{margin:14px 0 7px}#suggestions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.suggestion{margin:0}.notice{font-size:.8rem}}@media(max-width:760px){.top{padding:8px 10px}.logo{width:38px;height:38px}.top b{font-size:.92rem}.test{font-size:.66rem;padding:6px 8px}.wrap{padding:10px 8px 14px}.setup{grid-template-columns:1fr;padding:11px}.grid{margin-top:10px;gap:10px}.chat{height:calc(100dvh - 245px);min-height:540px;border-radius:16px}.chathead{padding:12px}.messages{padding:14px 10px}.msg{max-width:94%;padding:13px 14px}.hanzi{font-size:1.3rem}.composer{padding:10px;grid-template-columns:48px minmax(0,1fr) auto;gap:7px}.composer input{padding:12px 10px}.mic{width:48px}.side{padding:12px}#suggestions{display:grid;grid-template-columns:1fr}.suggestion b{font-size:1rem}}@media(max-width:430px){.test{display:none}.composer{grid-template-columns:46px minmax(0,1fr)}.composer .primary{grid-column:1/-1}.chat{height:calc(100dvh - 260px)}}
</style></head><body>
<header class="top"><div class="logo">AI</div><div><b>Tiếng Trung Aluni · AI Speak</b><div style="color:var(--muted);font-size:.78rem">Bản thử tách riêng</div></div><span class="test">KHÔNG ẢNH HƯỞNG V49.1</span></header>
<main class="wrap"><div style="display:flex;gap:9px;margin-bottom:12px"><button class="btn primary" id="freeMode">💬 Nói tự do</button><button class="btn" id="lessonMode" style="background:#fff;border:1px solid var(--line)">🎓 Nói theo khóa học</button></div><section class="setup"><label>Quyền khóa học<select id="course"><option>Đang tải…</option></select></label><label id="lessonField" style="display:none">Bài học<select id="lesson"><option>Chọn khóa trước</option></select></label><button class="btn primary" id="start">Bắt đầu nói tự do</button></section>
<div class="grid"><section class="chat"><div class="chathead"><div><b id="title">Luyện nói cùng Tiểu Vũ</b><div id="subtitle" style="color:var(--muted);font-size:.82rem">Chọn bài để bắt đầu</div></div><span class="status" id="health">Đang kiểm tra…</span></div><div class="messages" id="messages"></div><div class="composer"><button class="btn mic" id="mic">🎙</button><input id="input" placeholder="Nói hoặc gõ câu tiếng Trung…"><button class="btn primary" id="send">Gửi</button></div></section>
<aside class="side"><div class="notice">Bản thử chỉ đánh giá nội dung, ngữ pháp và cách diễn đạt; chưa chấm phát âm/thanh điệu từ âm thanh.</div><h3 style="margin-top:18px">Câu gợi ý</h3><div id="suggestions"></div><div class="error" id="error"></div></aside></div></main>
<script>
const MAIN_API='https://aluni-tts.nhangohcm.workers.dev';
const AI_API=localStorage.getItem('aluni_ai_test_api')||'https://aluni-ai-speak-test.nhangohcm.workers.dev';
const ENT_KEY='aluni_entitlements_v46';let catalog=[],content=[],selected=null,history=[],mode='free';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function entitlements(){try{return JSON.parse(localStorage.getItem(ENT_KEY)||'{}')||{}}catch(e){return{}}}
function tokenFor(id){return entitlements()[id]?.token||''}
function deviceId(){let id=localStorage.getItem('aluni_device_id_v1')||'';if(!id){id='dev-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));localStorage.setItem('aluni_device_id_v1',id)}return id}
function deviceLabel(){return `${/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?'Điện thoại':'Máy tính'} · ${navigator.platform||'Trình duyệt'}`}
function addMessage(role,data){history.push({role,text:data.hanzi||''});const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'ai');d.innerHTML=`<div class="hanzi">${esc(data.hanzi||'')}</div>${data.pinyin?`<div class="pinyin">${esc(data.pinyin)}</div>`:''}${data.vi?`<div class="vi">${esc(data.vi)}</div>`:''}${data.feedback?`<div class="feedback"><b>Nhận xét:</b> ${esc(data.feedback.grammar_note||'')}${data.feedback.better?.hanzi?`<br><b>Nói tự nhiên hơn:</b> ${esc(data.feedback.better.hanzi)}`:''}</div>`:''}`;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;if(role==='ai'&&data.hanzi)speak(data.hanzi)}
function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.86;speechSynthesis.speak(u)}
function fillLessons(){const c=catalog.find(x=>String(x.id)===$('course').value);$('lesson').innerHTML='';(c?.lessons||[]).forEach(l=>$('lesson').add(new Option(`Bài ${String(l.number).padStart(2,'0')} · ${l.title}`,l.number)))}
function currentVocab(courseId,n){const c=content.find(x=>String(x.id)===String(courseId)),l=(c?.lessons||[]).find(x=>Number(x.number??x.lesson_number)===Number(n));return(l?.items||[]).map(x=>x.hanzi).filter(Boolean)}
async function load(){try{const [a,b]=await Promise.all([fetch(MAIN_API+'/learning-courses').then(r=>r.json()),fetch(MAIN_API+'/content/all').then(r=>r.json())]);const ents=entitlements();catalog=(a.courses||[]).filter(c=>ents[c.id]);content=b.courses||[];$('course').innerHTML='';catalog.forEach(c=>$('course').add(new Option(c.title,c.id)));fillLessons();if(!catalog.length)$('error').textContent='Thiết bị này chưa có khóa trả phí đã kích hoạt.'}catch(e){$('error').textContent='Không tải được dữ liệu khóa học.'}if(AI_API.startsWith('http')){try{const h=await fetch(AI_API+'/health').then(r=>r.json());$('health').textContent=h.has_gemini_key?'AI sẵn sàng':'Thiếu GEMINI_API_KEY'}catch(e){$('health').textContent='AI chưa kết nối'}}else{$('health').textContent='Chưa đặt URL Worker thử'}}
$('course').onchange=fillLessons;function setMode(next){mode=next;$('lessonField').style.display=mode==='lesson'?'grid':'none';$('start').textContent=mode==='lesson'?'Bắt đầu bài':'Bắt đầu nói tự do';$('freeMode').className='btn '+(mode==='free'?'primary':'');$('lessonMode').className='btn '+(mode==='lesson'?'primary':'')}$('freeMode').onclick=()=>setMode('free');$('lessonMode').onclick=()=>setMode('lesson');$('start').onclick=()=>{const c=catalog.find(x=>String(x.id)===$('course').value);if(!c)return;const l=mode==='lesson'?(c.lessons||[]).find(x=>Number(x.number)===Number($('lesson').value)):{number:0,title:'Nói tự do'};if(!l)return;selected={course:c,lesson:l};history=[];$('messages').innerHTML='';$('title').textContent=mode==='lesson'?`AI Speak · ${c.title}`:'AI Speak · Nói tự do';$('subtitle').textContent=mode==='lesson'?`Bài ${l.number} · ${l.title}`:'Trò chuyện tiếng Trung theo chủ đề bạn muốn';const greeting=mode==='lesson'?{hanzi:`你好！我们今天练习“${l.title}”。你准备好了吗？`,pinyin:'Nǐ hǎo! Nǐ zhǔnbèi hǎo le ma?',vi:'Xin chào! Hôm nay chúng ta luyện bài này. Bạn sẵn sàng chưa?'}:{hanzi:'你好！今天你想聊什么？',pinyin:'Nǐ hǎo! Jīntiān nǐ xiǎng liáo shénme?',vi:'Xin chào! Hôm nay bạn muốn trò chuyện về điều gì?'};addMessage('ai',greeting);renderSuggestions(mode==='lesson'?[{hanzi:'我准备好了。',pinyin:'Wǒ zhǔnbèi hǎo le.',vi:'Tôi sẵn sàng rồi.'},{hanzi:'我们开始吧。',pinyin:'Wǒmen kāishǐ ba.',vi:'Chúng ta bắt đầu thôi.'}]:[{hanzi:'我想聊聊我的生活。',pinyin:'Wǒ xiǎng liáoliao wǒ de shēnghuó.',vi:'Tôi muốn nói về cuộc sống của mình.'},{hanzi:'我们聊旅游吧。',pinyin:'Wǒmen liáo lǚyóu ba.',vi:'Chúng ta nói về du lịch nhé.'}])};
function renderSuggestions(rows){$('suggestions').innerHTML=(rows||[]).slice(0,3).map(x=>`<button class="suggestion" data-hanzi="${esc(x.hanzi)}"><b>${esc(x.hanzi)}</b><br><small>${esc(x.pinyin||'')} · ${esc(x.vi||'')}</small></button>`).join('');document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{$('input').value=b.dataset.hanzi;send()})}
async function send(){const text=$('input').value.trim();if(!text||!selected)return;$('input').value='';$('error').textContent='';addMessage('user',{hanzi:text});try{const r=await fetch(AI_API+'/ai-speak/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tokenFor(selected.course.id),'X-Aluni-Device':deviceId(),'X-Aluni-Device-Label':deviceLabel()},body:JSON.stringify({course_id:selected.course.id,user_message:text,lesson_title:selected.lesson.title,scenario:`Hội thoại theo Bài ${selected.lesson.number}`,vocabulary:currentVocab(selected.course.id,selected.lesson.number),history:history.slice(-8)})});const j=await r.json();if(!r.ok)throw new Error(j.error||'AI trả lỗi');addMessage('ai',j);renderSuggestions(j.suggestions)}catch(e){$('error').textContent=e.message}}
$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter')send()};$('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('error').textContent='Trình duyệt chưa hỗ trợ micro tiếng Trung. Hãy dùng Chrome/Edge hoặc gõ câu.';return}const r=new R();r.lang='zh-CN';r.interimResults=false;$('health').textContent='Đang nghe…';r.onresult=e=>{$('input').value=e.results[0][0].transcript;send()};r.onerror=()=>{$('error').textContent='Không nhận được giọng nói hoặc chưa cấp quyền micro.'};r.onend=()=>{$('health').textContent='AI sẵn sàng'};r.start()};load();
</script></body></html>
